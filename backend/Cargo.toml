[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
description = "Non-custodial split-payment routing and ledger middleware for East African fintech"
authors = ["kam1rah"]

[dependencies]
# web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "query"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "limit"] }

# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# redis / queue
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# auth & crypto
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
jsonwebtoken = "9"
base64 = "0.21"

# config
dotenvy = "0.15"

# tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ids
uuid = { version = "1", features = ["v4", "serde"] }

# time
chrono = { version = "0.4", features = ["serde"] }

# errors
thiserror = "1"
anyhow = "1"

# http client (for downstream payout calls)
reqwest = { version = "0.11", features = ["json"] }

# input validation
garde = "0.20"
